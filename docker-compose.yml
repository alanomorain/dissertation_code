services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dissertation_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:password@postgres:5432/dissertation_db?schema=public
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SLIDE_EXTRACTOR_URL: http://slide-extractor:8000
    command: sh -c "npm run db:migrate && npm run start"
    ports:
      - "3000:3000"
    depends_on:
      slide-extractor:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  slide-extractor:
    build:
      context: ./services/slide-extractor
      dockerfile: Dockerfile
    container_name: dissertation_slide_extractor
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: dissertation_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dissertation_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dissertation_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
